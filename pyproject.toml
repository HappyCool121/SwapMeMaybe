[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "liveswap"
version = "0.1.0"
description = "Timestamped clothing-replacement streams with warm Nosana GPU workers"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26.4,<2", "pillow>=11,<13", "pydantic>=2.10,<3",
  "httpx>=0.28,<0.29", "typer>=0.15,<1", "cryptography>=44,<47",
]

[project.optional-dependencies]
worker = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "huggingface-hub>=0.36,<2"]
client = ["opencv-contrib-python>=4.11,<4.12", "mediapipe>=0.10.21,<0.11", "sounddevice>=0.5,<0.6", "pyside6-essentials>=6.8,<7"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
liveswap = "liveswap.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/liveswap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"comfy_nodes/*" = ["I001"]
